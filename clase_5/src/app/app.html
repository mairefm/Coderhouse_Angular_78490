<mat-drawer-container class="example-container" autosize>
    <mat-drawer #drawer class="example-sidenav" mode="side">
        <mat-nav-list>
            <a mat-list-item href="#">Início</a>
            <a mat-list-item href="#">Cursos</a>
            <a mat-list-item href="#">Alumnos</a>
            <a mat-list-item href="#">Inscripciones</a>
        </mat-nav-list>
    </mat-drawer>

    <mat-drawer-content class="example-sidenav-content">
        <mat-toolbar color="primary" class="app-toolbar">
            <button mat-icon-button class="example-icon" aria-label="menu" (click)="drawer.toggle()">
                <mat-icon>menu</mat-icon>
            </button>
            <span>My App</span>
        </mat-toolbar>

        <div class="page-content">
            <app-users></app-users>
        </div>
    </mat-drawer-content>
</mat-drawer-container>
